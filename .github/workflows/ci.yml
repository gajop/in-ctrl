name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: The fixture's diagrams are current
        run: node bin/in-ctrl.mjs check --root test/fixture
      - name: The fixture's site builds
        run: node bin/in-ctrl.mjs site build "$RUNNER_TEMP/site" --root test/fixture
